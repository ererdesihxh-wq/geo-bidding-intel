name: 自动数据更新

on:
  schedule:
    # 每周日凌晨3点运行
    - cron: '7 3 * * 0'
  workflow_dispatch:  # 支持手动触发

jobs:
  crawl-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install requests beautifulsoup4 duckduckgo_search

      - name: 爬取新项目
        continue-on-error: true
        run: |
          python scripts/crawler.py

      - name: 构建数据
        run: |
          python scripts/build_data.py
          python scripts/generate_html.py

      - name: 检查是否有变化
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: 提交变更
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "GEO Bot"
          git config user.email "bot@geo-bidding.local"
          git add data/bidding_data.json docs/bidding_data.json docs/index.html data/crawled_projects.json
          git commit -m "chore: 数据更新 $(date +%Y-%m-%d)"
          git push
